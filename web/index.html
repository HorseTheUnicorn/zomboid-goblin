<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b100e"><title>CHVRCH // Zomboid Map</title><link rel="stylesheet" href="/assets/style.css?v=20260912-native2"></head>
<body>
<main id="map-viewport" aria-label="Project Zomboid map"><canvas id="map-canvas" aria-label="Player and Goblin positions"></canvas><div id="map-empty" hidden><strong>Map unavailable</strong><span>Waiting for the server map layer.</span></div></main>
<header class="overlay topbar">
<div class="brand"><span class="brand-mark">◆</span><h1>CHVRCH <span>// MAP</span></h1><span id="map-name" class="muted">Project Zomboid</span></div>
<div class="top-options">
<label class="filter player"><input id="show-players" type="checkbox" checked>Players <span id="player-count">0</span></label>
<label class="filter goblin"><input id="show-goblins" type="checkbox" checked>Goblins <span id="npc-count">0</span></label>
<label class="filter"><input id="show-trails" type="checkbox" checked>Trails</label>
<select id="focus-entity" aria-label="Find player or Goblin"><option value="">Find player or Goblin</option></select>
</div></header>
<footer class="overlay bottom-bar">
<nav class="map-controls" aria-label="Map controls"><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="fit-map" type="button">Fit world</button><button id="focus-goblin" type="button">Focus Goblin</button></nav>
<div class="map-info"><span id="map-coordinates">—</span><span id="map-status" class="muted">Drag to pan · scroll to zoom</span><span class="attribution">Map imagery © The Indie Stone · unofficial server map</span></div>
<div class="connection" aria-live="polite"><span id="connection-dot" class="status-dot status-unknown"></span><span id="connection-label">Connecting</span><span id="last-seen" class="muted">—</span></div>
</footer><script src="/assets/app.js?v=20260912-native2" defer></script></body></html>
